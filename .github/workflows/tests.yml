name: Mathematical and DSAT regression tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (no external dependencies)
        run: python -m unittest discover -s tests -v
      - name: DSAT curve and diagnostic self-test
        run: python models/dsat/dsat1994_planner.py selftest
